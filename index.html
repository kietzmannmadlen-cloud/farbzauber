<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Die zauberhaften Farbkleckse</title><style>body{margin:0;background:#f5efff;font-family:system-ui,sans-serif;color:#34264c}main{max-width:720px;margin:auto;padding:16px;text-align:center}h1{font-size:clamp(23px,5vw,34px);margin:8px}#prompt{font-size:clamp(20px,5vw,28px);font-weight:750;min-height:68px;margin:14px 0}#scene{position:relative;height:min(57vh,430px);min-height:310px;background:#fffdf5;border:3px solid #eadcf5;border-radius:25px;overflow:hidden;touch-action:none;user-select:none}.blob{position:absolute;border-radius:48% 52% 44% 56%;box-shadow:inset -8px -10px #0000000b;touch-action:none}.controls{display:flex;justify-content:center;gap:12px;margin-top:12px}button{border:0;border-radius:18px;background:#7952c6;color:white;padding:13px 22px;font-size:17px;font-weight:700}button.secondary{background:#e5d8fa;color:#4b3475}#hint,#count{font-size:15px;margin:9px;color:#685c7c}#count{font-size:13px}.stamp{position:absolute;inset:0;display:grid;place-items:center;font-size:140px;color:#9b70d4;cursor:pointer}.spark{position:absolute;font-size:24px;pointer-events:none}</style></head><body><main><h1>🎨 Die zauberhaften Farbkleckse</h1><div id="prompt"></div><div id="scene"></div><div id="hint"></div><div class="controls"><button class="secondary" id="back">← Zurück</button><button id="next">Spiel starten</button></div><div id="count"></div></main><script>
(()=>{'use strict';const scene=document.querySelector('#scene'),prompt=document.querySelector('#prompt'),hint=document.querySelector('#hint'),next=document.querySelector('#next'),back=document.querySelector('#back'),count=document.querySelector('#count');const colors={rot:'#ec4e55',gelb:'#f6ce35',blau:'#489ce8',gruen:'#45b979',orange:'#f39a38',lila:'#a17ad6',rosa:'#ed91b9',weiss:'#fff'};let page=0,step=0,done=false,epoch=0,timeout;const tasks=[['Tippe dreimal auf Rot!','tap','rot',3],['Tippe dreimal auf Gelb!','tap','gelb',3],['Tippe dreimal auf Blau!','tap','blau',3],['Reibe über den roten Klecks!','rub','rot'],['Lass Blau größer werden!','size','blau',1.6],['Mach Gelb ganz klein!','size','gelb',.5],['Schiebe Rot zu Gelb!','mix','rot','gelb','orange'],['Reibe über Orange!','rub','orange'],['Schiebe Blau zu Gelb!','mix','blau','gelb','gruen'],['Tippe dreimal auf Grün!','tap','gruen',3],['Schiebe Rot zu Blau!','mix','rot','blau','lila'],['Mach Lila riesengroß!','size','lila',1.7],['Schiebe Rot zu Weiß!','mix','rot','weiss','rosa'],['Lass die rosa Kleckse verschwinden!','pop','rosa'],['Schiebe Gelb zu Rot!','mix','gelb','rot','orange'],['Lass viele bunte Punkte erscheinen!','rain'],['Tippe auf fünf Punkte!','many'],['Lege deine Hand auf die Punkte!','hand'],['Schau, ein Handabdruck! Tippe darauf.','stamp'],['Tippe, damit alle Punkte verschwinden!','clear'],['Mische Blau und Gelb noch einmal!','mix','blau','gelb','gruen'],['Schiebe Rot und Blau zusammen!','mix','rot','blau','lila'],['Schüttle die bunten Punkte!','shake'],['Tippe auf den Regenbogen!','rainbow'],['Lass alle Punkte verschwinden!','clear'],['Tippe auf die drei Grundfarben!','primary'],['Mische Rot und Gelb!','mix','rot','gelb','orange'],['Mische Blau und Gelb!','mix','blau','gelb','gruen'],['Mische Rot und Blau!','mix','rot','blau','lila'],['Ein letzter Zauber: Tippe auf alle Farben!','final']];const total=tasks.length;
function blob(c,x,y,size=110){const e=document.createElement('div');e.className='blob';e.style.background=colors[c]||c;e.style.left=x+'%';e.style.top=y+'%';e.style.width=size+'px';e.style.height=size+'px';scene.append(e);return e}function dots(n=42){const names=['rot','gelb','blau','gruen','orange','lila','rosa'];for(let i=0;i<n;i++)blob(names[i%names.length],4+Math.random()*88,5+Math.random()*82,12+Math.random()*20)}function sparkle(){for(let i=0;i<9;i++){let s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.left=Math.random()*90+'%';s.style.top=Math.random()*85+'%';s.style.color=Object.values(colors)[i%7];scene.append(s)}}function complete(msg){if(done)return;done=true;prompt.textContent=msg;hint.textContent='Gut gemacht! Gleich geht es weiter.';next.hidden=false;next.textContent='Weiter →';sparkle();const e=epoch;timeout=setTimeout(()=>{if(e===epoch){page++;render()}},1700)}function tap(e,fn){e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!done)fn(ev)})}
function render(){epoch++;clearTimeout(timeout);step=0;done=false;scene.replaceChildren();scene.onpointerdown=null;scene.onpointerup=null;scene.onpointermove=null;back.hidden=page===0;next.hidden=true;hint.textContent='Mach mit und entdecke die Farben!';count.textContent=page===0?`${total} kleine Farbzauber`:`Seite ${Math.min(page,total)} von ${total}`;if(page===0){prompt.textContent='Bereit für ein Farben-Abenteuer?';scene.innerHTML='<div style="font-size:110px;padding-top:80px">🎨</div>';next.hidden=false;next.textContent='Spiel starten';return}if(page>total){prompt.textContent='Geschafft! Du bist ein Farben-Zauberer!';scene.innerHTML='<div style="font-size:110px;padding-top:75px">🌈🎉</div>';hint.textContent='Das war toll!';next.hidden=false;next.textContent='Noch einmal spielen';return}const [label,type,a,b,c]=tasks[page-1];prompt.textContent=label;
if(type==='tap'){const d=blob(a,35,24,125);tap(d,()=>{step++;blob(a,10+((step-1)%3)*27,69,38);if(step>=b)complete('Oh! Jetzt sind es viele Kleckse!')})}
if(type==='rub'){hint.textContent='Streiche mit dem Finger hin und her.';const d=blob(a,31,24,145);let last=null,dist=0;d.onpointerdown=e=>{last=e.clientX;d.setPointerCapture(e.pointerId)};d.onpointermove=e=>{if(last===null||done)return;dist+=Math.abs(e.clientX-last);last=e.clientX;if(dist>90){scene.replaceChildren();blob(a,12,27,105);blob(a,57,27,105);complete('Aus einem wurden zwei!')}};d.onpointerup=()=>last=null}
if(type==='size'){const d=blob(a,35,28,125);tap(d,()=>{d.style.transform=`scale(${b})`;complete(b>1?'Wow! Riesengroß!':'Oh, ganz winzig!')})}
if(type==='mix'){hint.textContent='Ziehe einen Klecks zum anderen. Beobachte die Mischfarbe!';const left=blob(a,8,27,115),right=blob(b,60,27,115),mix=blob(c,36,30,115);mix.style.opacity='0';mix.style.pointerEvents='none';[left,right].forEach((el,i)=>{let start=null;el.onpointerdown=e=>{if(done)return;start={x:e.clientX,left:i===0?8:60};el.setPointerCapture(e.pointerId);e.preventDefault()};el.onpointermove=e=>{if(!start||done)return;let x=Math.max(0,Math.min(76,start.left+(e.clientX-start.x)/scene.clientWidth*100));el.style.left=x+'%';let other=i===0?60:8;let progress=Math.max(0,Math.min(1,(52-Math.abs(x-other))/34));mix.style.opacity=String(progress);mix.style.transform=`scale(${.5+progress*.8})`;if(progress>=.93){start=null;left.style.opacity='0';right.style.opacity='0';mix.style.opacity='1';mix.style.transform='scale(1.3)';complete('Schau! Die Farben haben sich vermischt!')}};el.onpointerup=()=>start=null})}
if(type==='pop'){let hits=0;for(let i=0;i<5;i++){const d=blob(a,8+(i%3)*29,12+Math.floor(i/3)*43,76);tap(d,()=>{if(d.dataset.hit)return;d.dataset.hit=1;d.style.opacity='0';hits++;if(hits===5)complete('Alle rosa Kleckse sind weg!')})}}
if(type==='rain'){const d=blob('rot',35,27,120);tap(d,()=>{scene.replaceChildren();dots(50);complete('Ein bunter Punkteregen!',2100)})}
if(type==='many'){dots();let hits=0;scene.querySelectorAll('.blob').forEach(d=>tap(d,()=>{if(d.dataset.hit)return;d.dataset.hit=1;d.style.transform='scale(1.6)';if(++hits>=5)complete('So viele schöne Farben!')}))}
if(type==='hand'){dots(48);hint.textContent='Lege deine Hand auf die bunten Punkte.';scene.onpointerdown=()=>{if(done)return;scene.replaceChildren();const hand=document.createElement('div');hand.className='stamp';hand.textContent='🖐️';scene.append(hand);complete('Ein Handabdruck!')};}
if(type==='stamp'){scene.innerHTML='<div class="stamp">🖐️</div>';tap(scene.querySelector('.stamp'),()=>complete('Dein zauberhafter Handabdruck!'))}
if(type==='clear'){dots(50);tap(scene,()=>{scene.querySelectorAll('.blob').forEach(d=>{d.style.opacity='0';d.style.transform='scale(.1)'});complete('Hui! Alle Punkte sind verschwunden!')})}
if(type==='shake'){dots(22);hint.textContent='Wische viermal kräftig hin und her.';let x=null;scene.onpointerdown=e=>{x=e.clientX;scene.setPointerCapture(e.pointerId)};scene.onpointerup=e=>{if(x===null||done)return;if(Math.abs(e.clientX-x)>35){step++;scene.querySelectorAll('.blob').forEach(d=>{d.style.left=Math.random()*85+'%';d.style.top=Math.random()*80+'%'})}x=null;if(step>=4)complete('Alle Farben tanzen!')}}
if(type==='rainbow'){scene.innerHTML='<div style="font-size:140px;padding-top:60px">🌈</div>';tap(scene,()=>complete('Ein wunderschöner Regenbogen!'))}
if(type==='primary'){let hits=0;['rot','gelb','blau'].forEach((col,i)=>{let d=blob(col,7+i*30,32,95);tap(d,()=>{if(d.dataset.hit)return;d.dataset.hit=1;d.style.transform='scale(1.2)';if(++hits===3)complete('Rot, Gelb und Blau!')})})}
if(type==='final'){dots(45);tap(scene,()=>{scene.querySelectorAll('.blob').forEach(d=>d.style.opacity='0');complete('Alle Farben sind verschwunden!')})}
}next.onclick=()=>{if(page===0)page=1;else if(page>total)page=0;else page++;render()};back.onclick=()=>{page=Math.max(0,page-1);render()};render();})();
</script></body></html>
